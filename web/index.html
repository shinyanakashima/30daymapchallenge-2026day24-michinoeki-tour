<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Michi-no-Eki in Hokkaido, in one drive</title>
<meta name="description" content="The shortest road loop through every roadside station (Michi-no-Eki) in Hokkaido, computed with OpenStreetMap and OSRM. #30DayMapChallenge 2026 Day 24: Network.">
<meta property="og:title" content="Every Michi-no-Eki in Hokkaido, in one drive">
<meta property="og:description" content="The shortest road loop through every roadside station in Hokkaido. #30DayMapChallenge 2026 Day 24: Network.">
<meta property="og:image" content="https://shinyanakashima.github.io/30daymapchallenge-2026day24-michinoeki-tour/screenshot.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%23c3362b' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" role="region" aria-label="Map"></div>

<header id="title" class="panel">
  <p class="kicker" data-i18n="kicker"></p>
  <h1 id="headline"></h1>
  <p class="lede" id="lede"></p>
  <div class="start-row">
    <label for="start" data-i18n="startLabel"></label>
    <select id="start"></select>
  </div>
  <p class="hint" id="start-note"></p>
</header>

<div id="lang" class="panel" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="true">EN</button>
  <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
</div>

<div id="player" class="panel">
  <button type="button" id="play" aria-label="Play"><span class="tri" aria-hidden="true"></span><span id="play-text"></span></button>
  <div class="player-body">
    <div class="day-line"><strong id="day">&nbsp;</strong> <span id="day-sub"></span></div>
    <input id="scrub" type="range" min="0" max="1000" value="0" step="1" aria-label="Position along the route">
  </div>
</div>

<aside id="stats" class="panel" aria-label="Totals">
  <dl>
    <div><dt data-i18n="statDistance"></dt><dd id="s-dist"></dd></div>
    <div><dt data-i18n="statTime"></dt><dd id="s-time"></dd></div>
    <div><dt data-i18n="statDays"></dt><dd id="s-days"></dd></div>
    <div><dt data-i18n="statMunis"></dt><dd id="s-munis"></dd></div>
  </dl>
  <button type="button" id="about-btn" class="link" data-i18n="about"></button>
</aside>

<dialog id="about">
  <form method="dialog"><button class="close" aria-label="Close">×</button></form>
  <div id="about-body"></div>
</dialog>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
